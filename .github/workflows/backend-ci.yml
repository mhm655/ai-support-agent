name: Backend CI

# No `paths:` filter here on purpose: branch protection requires this
# workflow's job to pass before merging, and a required check that a
# path filter sometimes skips leaves GitHub waiting on a status that
# will never arrive, blocking the PR forever. Running on every push/PR
# is cheap enough at this repo's size to not be worth that risk.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile-check every module (catches syntax/import errors early)
        run: python -m compileall -q app

      # No real Supabase/Gemini credentials exist in CI — conftest.py sets
      # dummy env vars before importing app code, and every test mocks
      # network calls out (see tests/conftest.py). Nothing here talks to
      # a real external service.
      - name: Run tests
        run: python -m pytest -v
