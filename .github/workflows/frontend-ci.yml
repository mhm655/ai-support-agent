name: Frontend CI

# No `paths:` filter here on purpose: branch protection requires these
# jobs to pass before merging, and a required check that a path filter
# sometimes skips leaves GitHub waiting on a status that will never
# arrive, blocking the PR forever. Running on every push/PR is cheap
# enough at this repo's size to not be worth that risk.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: frontend

# Dummy values — the build only needs these to exist (Next.js inlines
# NEXT_PUBLIC_* vars at build time), it never actually calls Supabase.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Next.js 16 generates some ambient types (e.g. LayoutProps) into
      # .next/types/ during a build, so type-check only works after this —
      # running tsc first fails with "Cannot find name 'LayoutProps'" on a
      # clean checkout even though the code is fine.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # These e2e tests run against the production build with no real
      # backend (see playwright.config.ts) — they cover static rendering,
      # navigation, and client-side error handling, not full user flows
      # that need Supabase/Gemini. That gap is intentional for now; see
      # the frontend CLAUDE.md / project README for the tradeoff.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
